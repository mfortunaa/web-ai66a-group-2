<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thông tin xác nhận đặt vé trên Eventy.">
  <title>Xác nhận đặt vé | Eventy</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/confirmation.css">
  <script type="module" src="../js/confirmation.js"></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="events.html" aria-label="Eventy – Khám phá sự kiện">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Z"/><path d="M15 5v14" stroke-dasharray="2 2"/></svg>
        <span>eventy</span>
      </a>
      <nav class="site-nav" aria-label="Điều hướng chính">
        <a class="nav-link" href="events.html">Sự kiện</a>
        <button id="logout" class="secondary" type="button">Đăng xuất</button>
      </nav>
    </header>

    <main class="flow-main">
      <p class="eyebrow">THÔNG TIN ĐẶT VÉ</p>
      <h1 id="page-title">Đang kiểm tra đặt vé</h1>
      <p id="page-message" class="page-message" role="status" aria-live="polite">Đang tải xác nhận từ máy chủ…</p>
      <button id="retry" class="button-secondary" type="button" hidden>Thử tải lại</button>

      <section id="confirmation-content" class="confirmation-card" aria-labelledby="event-title" hidden>
        <p id="booking-status" class="status-pill"></p>
        <h2 id="event-title"></h2>
        <dl class="booking-summary">
          <div><dt>Mã đặt vé</dt><dd id="booking-reference"></dd></div>
          <div><dt>Suất diễn</dt><dd id="event-time"></dd></div>
          <div><dt>Số lượng vé</dt><dd id="booking-quantity"></dd></div>
          <div><dt>Người tham dự</dt><dd id="attendee-name"></dd></div>
          <div><dt>Email</dt><dd id="attendee-email"></dd></div>
          <div><dt>Số điện thoại</dt><dd id="attendee-phone"></dd></div>
          <div><dt>Tổng tiền</dt><dd id="booking-total" class="summary-total"></dd></div>
        </dl>
        <a id="payment-link" class="payment-link" href="events.html" hidden>Quay lại thanh toán mô phỏng</a>
        <a class="home-link" href="events.html">Khám phá thêm sự kiện</a>
      </section>
    </main>
    <footer class="site-footer">Eventy · Hệ thống giới thiệu &amp; đăng ký sự kiện</footer>
  </div>
</body>
</html>

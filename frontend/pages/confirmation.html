<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thông tin xác nhận đặt vé trên Eventy.">
  <title data-i18n-vi="Xác nhận đặt vé | Eventy" data-i18n-en="Booking confirmation | Eventy">Xác nhận đặt vé | Eventy</title>
  <script src="../js/site-preferences-init.js?v=2"></script>
  <link rel="stylesheet" href="../css/common.css?v=3">
  <link rel="stylesheet" href="../css/confirmation.css?v=2">
  <script type="module" src="../js/confirmation.js?v=2"></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="events.html" aria-label="Eventy – Khám phá sự kiện">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Z"/><path d="M15 5v14" stroke-dasharray="2 2"/></svg>
        <span>eventy</span>
      </a>
      <nav class="site-nav" aria-label="Điều hướng chính" data-i18n-aria-vi="Điều hướng chính" data-i18n-aria-en="Main navigation">
        <button id="language-toggle" class="header-control" type="button">EN</button>
        <button id="theme-toggle" class="header-control" type="button" aria-pressed="false"><span data-theme-icon aria-hidden="true">◐</span><span data-theme-label>Giao diện tối</span></button>
        <details class="account-menu">
          <summary class="account-menu-trigger" aria-label="Mở menu tài khoản" data-i18n-aria-vi="Mở menu tài khoản" data-i18n-aria-en="Open account menu">
            <svg class="account-avatar" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <svg class="account-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg>
          </summary>
          <div class="account-menu-panel">
            <a class="account-menu-item" href="my-bookings.html" data-i18n-vi="Vé của tôi" data-i18n-en="My bookings">Vé của tôi</a>
            <a class="account-menu-item" href="account-settings.html" data-i18n-vi="Cài đặt tài khoản" data-i18n-en="Account settings">Cài đặt tài khoản</a>
            <button id="logout" class="account-menu-item account-menu-logout" type="button" data-i18n-vi="Đăng xuất" data-i18n-en="Log out">Đăng xuất</button>
          </div>
        </details>
      </nav>
    </header>

    <main class="flow-main">
      <h1 id="page-title">Đang kiểm tra đặt vé</h1>
      <p id="page-message" class="page-message" role="status" aria-live="polite">Đang tải xác nhận từ máy chủ…</p>
      <button id="retry" class="button-secondary" type="button" hidden data-i18n-vi="Thử tải lại" data-i18n-en="Try again">Thử tải lại</button>

      <section id="confirmation-content" class="confirmation-card" aria-labelledby="event-title" hidden>
        <p id="booking-status" class="status-pill"></p>
        <h2 id="event-title"></h2>
        <dl class="booking-summary">
          <div><dt data-i18n-vi="Mã đặt vé" data-i18n-en="Booking reference">Mã đặt vé</dt><dd id="booking-reference"></dd></div>
          <div><dt data-i18n-vi="Suất diễn" data-i18n-en="Performance">Suất diễn</dt><dd id="event-time"></dd></div>
          <div><dt data-i18n-vi="Số lượng vé" data-i18n-en="Ticket quantity">Số lượng vé</dt><dd id="booking-quantity"></dd></div>
          <div><dt data-i18n-vi="Người tham dự" data-i18n-en="Attendee">Người tham dự</dt><dd id="attendee-name"></dd></div>
          <div><dt>Email</dt><dd id="attendee-email"></dd></div>
          <div><dt data-i18n-vi="Số điện thoại" data-i18n-en="Phone number">Số điện thoại</dt><dd id="attendee-phone"></dd></div>
          <div><dt data-i18n-vi="Tổng tiền" data-i18n-en="Total">Tổng tiền</dt><dd id="booking-total" class="summary-total"></dd></div>
        </dl>
        <a id="payment-link" class="payment-link" href="events.html" hidden data-i18n-vi="Quay lại thanh toán mô phỏng" data-i18n-en="Return to simulated payment">Quay lại thanh toán mô phỏng</a>
        <a class="home-link" href="events.html" data-i18n-vi="Khám phá thêm sự kiện" data-i18n-en="Discover more events">Khám phá thêm sự kiện</a>
        <a class="home-link" href="my-bookings.html" data-i18n-vi="Về Vé của tôi" data-i18n-en="Back to My bookings">Về Vé của tôi</a>
      </section>
    </main>
    <footer class="site-footer" data-i18n-vi="Eventy · Hệ thống giới thiệu &amp; đăng ký sự kiện" data-i18n-en="Eventy · Event discovery and booking">Eventy · Hệ thống giới thiệu &amp; đăng ký sự kiện</footer>
  </div>
</body>
</html>

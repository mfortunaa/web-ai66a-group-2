<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản | Eventy</title><link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/account-page.js"></script>
</head>
<body><div class="auth-shell">
  <header class="auth-header"><a class="brand" href="events.html" aria-label="Eventy – Tài khoản"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Z"/><path d="M15 5v14" stroke-dasharray="2 2"/></svg><span>eventy</span></a><button id="logout" class="secondary" type="button">Đăng xuất</button></header>
  <main class="account-content">
    <h1>Tài khoản</h1>
    <p id="page-message" class="message" role="status">Đang kiểm tra tài khoản…</p>
    <button id="retry" class="secondary" type="button" hidden>Thử lại</button>
    <div id="account-content" class="account-grid" hidden>
      <section class="profile-panel" aria-labelledby="profile-title"><h2 id="profile-title">Thông tin của bạn</h2><dl><div><dt>Họ và tên</dt><dd id="user-name"></dd></div><div><dt>Email</dt><dd id="user-email"></dd></div></dl></section>
      <section class="notice" aria-labelledby="events-title"><h2 id="events-title">Sự kiện</h2><p>Danh sách sự kiện đang được xây dựng. Bạn đã đăng nhập và có thể quay lại đây khi danh sách sẵn sàng.</p></section>
    </div>
  </main>
  <footer class="auth-footer">Eventy · Hệ thống giới thiệu &amp; đăng ký sự kiện</footer>
</div></body>
</html>

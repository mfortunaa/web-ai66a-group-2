services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SECRET_KEY: ${EVENTY_SECRET_KEY:?Set EVENTY_SECRET_KEY in the root .env; see .env.example}
      DATABASE_URL: sqlite:////data/eventy.db
      FRONTEND_URL: http://localhost:${EVENTY_HTTP_PORT:-8080}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      MAIL_FROM: noreply@eventy.local
    ports:
      - "127.0.0.1:${EVENTY_HTTP_PORT:-8080}:8000"
    volumes:
      - eventy-data:/data
    depends_on:
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:${EVENTY_MAIL_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  eventy-data:
  mailpit-data:
